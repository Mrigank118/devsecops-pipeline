name: Docker Build and Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  ci:
    name: CI build
    uses: ./.github/workflows/ci.yml

  security:
    name: Security scans
    uses: ./.github/workflows/security.yml
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  dast:
    name: API checks and DAST
    uses: ./.github/workflows/dast.yml

  infrastructure:
    name: Terraform and Checkov
    uses: ./.github/workflows/infrastructure.yml

  scorecard:
    name: OSSF Scorecard
    uses: ./.github/workflows/scorecard.yml

  container-security:
    name: Container Security Gate
    uses: ./.github/workflows/container-security.yml

  publish:
    name: Build and Publish Docker Images
    needs:
      - ci
      - security
      - dast
      - infrastructure
      - scorecard
      - container-security
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build server image
        run: |
          docker build \
            -f docker/Dockerfile.server \
            -t "$DOCKERHUB_USERNAME/devsecops-server:$GITHUB_SHA" \
            .

      - name: Build client image
        env:
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}
        run: |
          REACT_APP_API_URL="${REACT_APP_API_URL:-https://studio-chairs.vercel.app}"
          docker build \
            -f docker/Dockerfile.client \
            --build-arg "REACT_APP_API_URL=$REACT_APP_API_URL" \
            -t "$DOCKERHUB_USERNAME/devsecops-client:$GITHUB_SHA" \
            .

      - name: Push server image
        run: |
          docker push \
            "$DOCKERHUB_USERNAME/devsecops-server:$GITHUB_SHA"

      - name: Push client image
        run: |
          docker push \
            "$DOCKERHUB_USERNAME/devsecops-client:$GITHUB_SHA"
