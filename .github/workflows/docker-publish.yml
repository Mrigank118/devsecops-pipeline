name: Docker Build and Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-security:
    name: Container Security Gate
    uses: ./.github/workflows/container-security.yml

  publish:
    name: Build and Publish Docker Images
    needs: container-security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build server image
        run: |
          docker build \
            -f docker/Dockerfile.server \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-server:${{ github.sha }} \
            .

      - name: Build client image
        run: |
          docker build \
            -f docker/Dockerfile.client \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-client:${{ github.sha }} \
            .

      - name: Push server image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-server:${{ github.sha }}

      - name: Push client image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-client:${{ github.sha }}