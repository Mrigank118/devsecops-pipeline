repos:
  # ============================================================
  # DEVSECOPS PRE-COMMIT SECURITY PIPELINE
  # ============================================================

  # ------------------------------------------------------------
  # 0. START MESSAGE
  # ------------------------------------------------------------
  - repo: local
    hooks:
      - id: devsecops-start
        name: "[DEVSECOPS] Starting security checks"
        entry: >-
          bash -c
          'echo "";
          echo "============================================================";
          echo " DEVSECOPS PRE-COMMIT SECURITY PIPELINE";
          echo "============================================================";
          echo " Starting security checks before commit...";
          echo ""'
        language: system
        pass_filenames: false
        always_run: true

  # ------------------------------------------------------------
  # 1. SECRET DETECTION - GITLEAKS
  # ------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
        name: "[1/2] Secret Detection - Gitleaks"

  # ------------------------------------------------------------
  # 2. STATIC APPLICATION SECURITY TESTING - SEMGREP
  # ------------------------------------------------------------
  - repo: https://github.com/semgrep/pre-commit
    rev: v1.147.0
    hooks:
      - id: semgrep
        name: "[2/2] Static Security Analysis - Semgrep"
        pass_filenames: false
        args:
          - "--config"
          - "auto"
          - "-j"
          - "1"

  # ------------------------------------------------------------
  # 3. COMPLETION MESSAGE
  # ------------------------------------------------------------
  - repo: local
    hooks:
      - id: devsecops-complete
        name: "[DEVSECOPS] Security checks passed"
        entry: >-
          bash -c
          'echo "";
          echo "============================================================";
          echo " DEVSECOPS PRE-COMMIT SECURITY PIPELINE COMPLETE";
          echo "============================================================";
          echo " All configured security checks passed.";
          echo " Commit is allowed.";
          echo ""'
        language: system
        pass_filenames: false
        always_run: true